services:

  postgres:
    image: postgres:16

    container_name: taskflow-db

    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

  app:
    build: .

    container_name: taskflow-api

    ports:
      - "8080:8080"

    depends_on:
      - postgres